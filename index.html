<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>AI Resume Analyzer with Gemini</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/pdfjs-dist@4.0.379/build/pdf.min.mjs" type="module"></script>
</head>
<body>
    <div class="container">
        <h1>Gemini Resume Analyzer 🚀</h1>
        <p>Upload your resume (PDF or TXT) and an optional job description for tailored feedback.</p>
        
        <label for="resume-file">Upload Resume File (PDF/TXT):</label>
        <input type="file" id="resume-file" accept=".pdf,.txt" required>
        
        <label for="job-description">Paste Job Description (Optional):</label>
        <textarea id="job-description" rows="5" placeholder="Paste the job description here..."></textarea>

        <button onclick="analyzeResume()">Analyze Resume</button>

        <hr>

        <h2>Analysis Results</h2>
        <div id="results-container">
            <p>Upload a file and click "Analyze Resume" to see the results.</p>
        </div>
    </div>
    <script src="script.js" type="module"></script> 
</body>
</html>
